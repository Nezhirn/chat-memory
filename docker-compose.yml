name: chat-memory

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chat_memory
      POSTGRES_USER: chat_memory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_memory -d chat_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chat_memory:${DB_PASSWORD}@db:5432/chat_memory
    ports:
      - "8088:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz").read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chat_memory:${DB_PASSWORD}@db:5432/chat_memory
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m app.migrate && python -m app.bot
    restart: unless-stopped

volumes:
  pgdata:
