name: chat-memory-external

services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    ports:
      - "8088:8000"
    networks:
      - python_api_base
    command:
      - sh
      - -c
      - python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    networks:
      - python_api_base
    command:
      - sh
      - -c
      - python -m app.migrate && python -m app.bot
    restart: unless-stopped

networks:
  python_api_base:
    external: true
